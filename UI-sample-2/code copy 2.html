<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .ultra-thin-glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }
        .core-pulse {
            animation: pulse-ring 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .orbit {
            animation: orbit-spin 60s linear infinite;
        }
        @keyframes orbit-spin {
            100% { transform: rotate(360deg); }
        }
        .thread-glow {
            filter: drop-shadow(0 0 8px rgba(0, 119, 182, 0.5));
            animation: thread-pulse 3s infinite alternate;
        }
        @keyframes thread-pulse {
            from { opacity: 0.4; stroke-width: 1px; }
            to { opacity: 1; stroke-width: 2px; }
        }
    </style>
