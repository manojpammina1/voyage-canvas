<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .ultra-thin-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }
        .core-pulse {
            animation: pulse-ring 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .orbit {
            animation: orbit-spin 60s linear infinite;
        }
        .orbit-pulse {
            animation: orbit-spin 60s linear infinite, glow-pulse 3s ease-in-out infinite alternate;
        }
        @keyframes orbit-spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes glow-pulse {
            0% { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 0 5px rgba(0,119,182,0.1) inset; }
            100% { border-color: rgba(255, 255, 255, 0.7); box-shadow: 0 0 20px rgba(0,119,182,0.4) inset; }
        }
        .thread-glow {
            filter: drop-shadow(0 0 8px rgba(0, 119, 182, 0.5));
            animation: thread-pulse 3s infinite alternate;
        }
        @keyframes thread-pulse {
            from { opacity: 0.4; stroke-width: 1px; }
            to { opacity: 1; stroke-width: 2px; }
        }
    </style>
