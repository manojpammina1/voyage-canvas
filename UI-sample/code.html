<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 119, 182, 0.2);
            box-shadow: 0 4px 20px rgba(0, 119, 182, 0.1);
        }
        
        .glass-overlay {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(0, 119, 182, 0.15);
            box-shadow: 0 4px 20px rgba(0, 119, 182, 0.1);
        }

        .glass-bridge {
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.4) 100%);
            backdrop-filter: blur(12px);
            border-top: 1px dashed rgba(0, 119, 182, 0.4);
            border-bottom: 1px dashed rgba(0, 119, 182, 0.4);
        }

        .node-pulse {
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 119, 182, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 119, 182, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 119, 182, 0); }
        }

        /* Orbit Positioning Classes */
        .orbit-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .orbit-r1-item1 { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); }
        .orbit-r1-item2 { position: absolute; top: 50%; left: 80%; transform: translate(-50%, -50%); }
        .orbit-r1-item3 { position: absolute; top: 80%; left: 50%; transform: translate(-50%, -50%); }
        .orbit-r1-item4 { position: absolute; top: 50%; left: 20%; transform: translate(-50%, -50%); }
        
        .orbit-r2-item1 { position: absolute; top: 5%; left: 30%; transform: translate(-50%, -50%); } /* Room 1 */
        .orbit-r2-item2 { position: absolute; top: 5%; left: 70%; transform: translate(-50%, -50%); } /* Room 2 */
        .orbit-r2-item3 { position: absolute; top: 50%; left: 95%; transform: translate(-50%, -50%); }
        .orbit-r2-item4 { position: absolute; top: 95%; left: 70%; transform: translate(-50%, -50%); }
        .orbit-r2-item5 { position: absolute; top: 95%; left: 30%; transform: translate(-50%, -50%); }

        .node-detail {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        
        .orbit-node:hover .node-detail, .orbit-node:focus-within .node-detail {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
