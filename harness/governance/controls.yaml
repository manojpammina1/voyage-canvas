# Agent-neutral control catalog — machine-readable spine for titan-render adapters.
# Each control declares policy once and enforcement per agent (honest boundary).

version: "1.0"

controls:
  - id: secret-block
    policy: "Never commit credentials, tokens, or keys."
    severity: hard-block
    logic: hooks/credential-scan.py
    claude:
      trigger: [PreToolUse]
      matcher: "Write|Edit"
    codex:
      trigger: [git-pre-commit, ci]
    cursor:
      trigger: [preToolUse, git-pre-commit, ci]

  - id: pii-redact
    policy: "Redact customer, PHI, and PII before it leaves the repo."
    severity: hard-block
    logic: hooks/redact-customer-data.py
    claude:
      trigger: [UserPromptSubmit, PreToolUse]
    codex:
      trigger: [ci]
      note: "Advisory in-editor; enforced in CI."
    cursor:
      trigger: [ci]
      note: "Advisory in-editor; enforced in CI."

  - id: protected-paths
    policy: "Pipeline, secret, and governance files are read-only without escalation."
    severity: hard-block
    logic: hooks/protect-secrets.py
    claude:
      trigger: [PreToolUse]
      from: settings-deny-list
    codex:
      trigger: [ci, git-pre-commit]
      from: path-guard
    cursor:
      trigger: [ci, git-pre-commit, preToolUse]
      from: path-guard

  - id: governance-lock
    policy: "Only the super role may edit governance files."
    severity: hard-block
    logic: hooks/protect-skills.py
    claude:
      trigger: [PreToolUse]
      matcher: "Write|Edit"
    codex:
      trigger: [ci]
      note: "No in-editor governance lock equivalent; CI path-guard on locked paths."
    cursor:
      trigger: [preToolUse]
      note: "Best-effort via protect-skills wrapper; CI backs up."

  - id: cost-preflight
    policy: "Estimate cost before large or sensitive prompts."
    severity: warn
    logic: hooks/cost-estimate.py
    claude:
      trigger: [UserPromptSubmit]
    codex:
      trigger: none
      note: "No Codex loop equivalent — provider-native budgeting; advisory only."
    cursor:
      trigger: none
      note: "No Cursor hook equivalent — advisory only in AGENTS.md."

  - id: answer-cache
    policy: "Zero-token fast paths for build, reviewers, known issues, governance lookup."
    severity: advisory
    logic: hooks/answer-cache.py
    claude:
      trigger: [UserPromptSubmit]
    codex:
      trigger: none
      note: "No local answer-cache runtime in Codex; use repo docs and scripts directly."
    cursor:
      trigger: none
      note: "Advisory only — no equivalent fast-path hook."

  - id: tool-output-crush
    policy: "Compress large tool outputs before they enter model context."
    severity: advisory
    logic: hooks/tool-output-crush.py
    claude:
      trigger: [PostToolUse]
    codex:
      trigger: none
      note: "Provider-native context management; not enforced locally."
    cursor:
      trigger: none
      note: "Provider-native context management; not enforced locally."

  - id: review-gate
    policy: "AI first-pass review; a human is accountable for merged code."
    severity: gate
    claude:
      via: "/orchestrate-review → review-orchestrator"
    codex:
      via: ".codex/review.mjs or CI agent-review workflow"
    cursor:
      via: "AGENTS.md review section + .codex/review.mjs or CI"

  - id: plugin-policy
    policy: "Only approved MCP servers and plugins may be used."
    severity: gate
    claude:
      via: "/common/mcp-audit + .mcp.json"
    codex:
      trigger: [ci]
      note: "CI plugin-policy check against governance controls."
    cursor:
      trigger: [ci]
      note: "CI plugin-policy check; rules in .cursor/rules/governance.mdc."

approved_tools:
  source: "config.governance.plugin_policy"
  audit_command: "/common/mcp-audit"
