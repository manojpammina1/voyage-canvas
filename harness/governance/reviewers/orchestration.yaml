# Review orchestrator fan-out graph — agent-neutral reviewer selection rules.

version: "1.0"

always_run:
  - file: correctness-reviewer.md
    model: sonnet
  - file: reliability-reviewer.md
    model: sonnet
  - file: maintainability-reviewer.md
    model: haiku
  - file: code-reviewer.md
    model: sonnet

conditional:
  - file: cif-contract-checker.md
    model: sonnet
    when: "FILES_CHANGED includes .graphql, OCC/commerce paths, app.config.yaml, or CIF files"
  - file: test-validator.md
    model: haiku
    when: "FILES_CHANGED includes new .java, .tsx, or .jsx"
  - file: component-usage-reviewer.md
    model: haiku
    when: "FILES_CHANGED includes .tsx or .jsx"
  - file: react-races-reviewer.md
    model: sonnet
    when: "React/Redux paths per config.stack.frontend"
  - file: strict-typescript-reviewer.md
    model: sonnet
    when: "FILES_CHANGED includes .ts or .tsx"
  - file: migration-reviewer.md
    model: sonnet
    when: "REPO flagged as mid-migration in config.repos"
  - file: migration-security-reviewer.md
    model: sonnet
    when: "credentials/PHI risk paths touched"
  - file: migration-challenger.md
    model: haiku
    when: "diff touches hard-stop-adjacent area (second opinion)"

post_process:
  - file: adversarial-verifier.md
    model: sonnet
    when: "aggregated findings non-empty"

cost_escape:
  threshold_files: 3
  narrow_to:
    - correctness-reviewer.md
    - code-reviewer.md

governance_precheck:
  source: "protected_paths from titan.config.json + data/reviewer-map.json"
  on_block: "Emit Escalation Alert; do not launch reviewers"

claude_entry: "/orchestrate-review → review-orchestrator.md"
codex_entry: "node .codex/review.mjs"
cursor_entry: "AGENTS.md review section + node .codex/review.mjs"
